[package]
name = "ort-superserve"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
xnnpack = ["ort/xnnpack"]
coreml = ["ort/coreml"]

[dependencies]
anyhow = "1.0.102"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
reqwest = { version = "0.13.2", features = ["json"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
axum = "0.8.8"
futures = "0.3.32"
image = "0.25.10"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
