[project]
name = "plots"
version = "0.1.0"
description = "Plot benchmark results from CSV files"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
]

[project.scripts]
generate-plots = "plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"